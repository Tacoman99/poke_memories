<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Poke Memories</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Poke Memories">
  <meta name="theme-color" content="#ffd9e6">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #ffd9e6; overflow: hidden;
      overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #ffd9e6; outline: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #ffd9e6; color: #b03a6a; font-family: -apple-system, system-ui, sans-serif; z-index: 2; }
    #loading h1 { font-size: 28px; margin: 0 0 18px; font-weight: 700; }
    #bar { width: 60%; max-width: 280px; height: 10px; background: #fff; border-radius: 6px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #e0567f; transition: width .15s; }
    #msg { margin-top: 14px; font-size: 14px; opacity: .8; padding: 0 24px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><h1>Poke Memories</h1><div id="bar"><div id="fill"></div></div><div id="msg">Loading…</div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
    createUnityInstance(canvas, {
      arguments: [],
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
    }, function (p) { document.getElementById("fill").style.width = (p * 100) + "%"; })
    .then(function () { document.getElementById("loading").style.display = "none"; })
    .catch(function (m) { document.getElementById("msg").textContent = "Couldn't load: " + m; });
  </script>
</body>
</html>
